        <a href="history.html" class="active">History</a>
    </nav>

    <a href="analyzer.html" class="nav-btn">New Analysis</a>

<main class="history-page">

    <div class="section-heading">
        <span class="badge">YOUR ACTIVITY</span>
        <h1>Analysis History</h1>
        <p>View and manage your previous resume analysis reports.</p>
    </div>

    <div class="history-stats">

        <div class="history-stat">
            <h2 id="totalCount">0</h2>
            <p>Total Analyses</p>
        </div>

        <div class="history-stat">
            <h2 id="averageScore">0</h2>
            <p>Average ATS Score</p>
        </div>

        <div class="history-stat">
            <h2 id="bestScore">0</h2>
            <p>Best ATS Score</p>
        </div>

    </div>

    <div class="history-heading">
        <h2>Previous Reports</h2>

        <button class="delete-btn" id="clearHistory">
            Clear All History
        </button>
    </div>

    <div id="historyList" class="history-list"></div>
